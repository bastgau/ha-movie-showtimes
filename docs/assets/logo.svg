<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2705A"/>
      <stop offset="1" stop-color="#B8262F"/>
    </linearGradient>
    <clipPath id="bar"><rect x="0" y="0" width="288" height="48" rx="6"/></clipPath>
    <g id="stripes" clip-path="url(#bar)">
      <rect width="288" height="48" fill="#fff"/>
      <path d="M24 0h36l-28 48h-36zM96 0h36l-28 48h-36zM168 0h36l-28 48h-36zM240 0h36l-28 48h-36z" fill="#C9323A"/>
    </g>
  </defs>
  <!-- Background: rounded square with vertical gradient (same shape as the other brand icons) -->
  <rect width="512" height="512" rx="32" fill="url(#bg)"/>
  <!-- Clapperboard: open top stick, fixed stick, body -->
  <g transform="translate(112 142) rotate(-14 0 48)"><use href="#stripes"/></g>
  <g transform="translate(112 206)"><use href="#stripes"/></g>
  <rect x="112" y="262" width="288" height="146" rx="16" fill="#fff"/>
  <!-- Clock face: the "showtime" -->
  <circle cx="256" cy="335" r="46" fill="none" stroke="#C9323A" stroke-width="12"/>
  <path d="M256 305v30l20 14" fill="none" stroke="#C9323A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
